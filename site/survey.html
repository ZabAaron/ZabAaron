        <main>

            <div id="making-a-form">
                <h1>Survey</h1>
                <form action="https://formspree.io/f/myzegeak" method="post">

                    <p>
                        <label for="name_field">What is your name?</label>
                        <input type="text" id="name_field" name="name_field" required>
                    </p>


                    <p>
                        <label for="email_field">What is your email address?</label>
                        <input type="email" id="email_field" name="email_field" required>
                    </p>


                    <p>
                        <label for="best_whole_number">Which whole number is best?</label>
                        <input type="number" id="best_whole_number" name="best_whole_number" min="1" step="1" required>
                    </p>


                    <p>
                        <label for="best_day">Which day is best?</label>
                        <input type="date" id="best_day" name="best_day" required>
                    </p>


                    <p>
                        <label for="best_bear">Which bear is best?</label>
                        <select id="best_bear" name="best_bear" required>
                            <option value="">&nbsp;</option>
                            <option value="black">Black Bear</option>
                            <option value="brown">Brown Bear</option>
                            <option value="care">Care Bear</option>
                            <option value="panda">Panda Bear</option>
                            <option value="polar">Polar Bear</option>
                            <option value="teddy">Teddy Bear</option>
                        </select>
                    </p>


                    <fieldset>
                        <legend>Do you like radio buttons?</legend>
                        <ul>
                            <li>
                                <label for="enjoys_radio_buttons_yes">
                                    Yes
                                    <input type="radio" id="enjoys_radio_buttons_yes" name="enjoys_radio_buttons"
                                        value="yes">
                                </label>
                            </li>
                            <li>
                                <label for="enjoys_radio_buttons_no">
                                    No
                                    <input type="radio" id="enjoys_radio_buttons_no" name="enjoys_radio_buttons"
                                        value="no">
                                </label>
                            </li>
                            <li>
                                <label for="enjoys_radio_buttons_nunya">
                                    None of your business!
                                    <input type="radio" id="enjoys_radio_buttons_nunya" name="enjoys_radio_buttons"
                                        value="?" checked>
                                </label>
                            </li>
                        </ul>
                    </fieldset>


                    <p>
                        <label for="life_meaning">What is the meaning of life?</label>
                        <textarea id="life_meaning" name="life_meaning" rows="5" cols="50"
                            placeholder="Enter the correct answer here"></textarea>
                    </p>


                    <p>
                        <button type="submit">Send</button>
                    </p>
                </form>
            </div>
