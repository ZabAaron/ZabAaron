<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles/main.css">

    <meta name="description" content="This page acts as a basic intro to web dev from the csd112 class.">
    <link rel="icon" type="image/png" href="Images/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="Images/favicon.svg">
    <link rel="shortcut icon" href="Images/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="Images/apple-touch-icon.png">
    <link rel="manifest" href="Images/site.webmanifest">
    <title>Index</title>

</head>

<body>
    <div class="width-wrap">
        <header id="top">
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="links.html">Links</a></li>
                    <li><a href="glossary.html">Glossary</a></li>

                </ul>
            </nav>
        </header>
        <main>
            <div id="survey">
                <h1>Survey</h1>
                <form action="https://formspree.io/f/myzegeak" method="post">
                    <p>
                        <label for="name_field">
                            What is your Name:</label>
                        <input type="text" id="name_field" name="name_field" required>

                    </p>
                    <p>
                        <label for="email_field">
                            What is your Email:
                        </label>
                        <input type="email" id="email_field" name="email_field" required>

                    </p>
                    <p>
                        <label for="best_number">
                            What is the best whole number:
                        </label>
                        <input type="number" id="best_number" name="best_number" min="1" step="1">
                    </p>

                    <p>
                        <label for="best_day">
                            What is your favorite day:
                        </label>
                        <input type="date" id="best_day" name="best_day">

                    </p>
                    <p>
                        <label for="best_bear">
                            Which bear is best?

                        </label>
                        <select id="best_bear" name="best_bear" required>
                            <option value="">&nbsp;</option>
                            <option value="black">Black Bear</option>
                            <option value="brown">Brown Bear</option>
                            <option value="care">Care Bear</option>
                            <option value="panda">Panda Bear</option>
                            <option value="polar">Polar Bear</option>
                            <option value="teddy">Teddy Bear</option>
                        </select>
                    </p>

                    <fieldset>
                        <legend> Do you like Radio buttons?</legend>
                        <ul>
                            <li>
                                <label for="enjoys_radio_buttons_yes">
                                    Yes
                                    <input type="radio" id="enjoys_radio_buttons_yes" name="enjoys_radio_buttons"
                                        value="yes">
                                </label>
                            </li>
                            <li>
                                <label for="enjoys_radio_buttons_no">
                                    No
                                    <input type="radio" id="enjoys_radio_buttons_no" name="enjoys_radio_buttons"
                                        value="no">
                                </label>
                            </li>
                            <li>
                                <label for="enjoys_radio_buttons_nunya">
                                    None of your business!
                                    <input type="radio" id="enjoys_radio_buttons_nunya" name="enjoys_radio_buttons"
                                        value="maybe" checked>
                                </label>
                            </li>
                        </ul>
                    </fieldset>

                    <p>
                        <label for="life_meaning">
                            What is the meaning of life?
                        </label>
                        <textarea id="life_meaning" name="life_meaning" rows="5" cols="50"
                            placeholder="Enter Answer Here">
                        </textarea>
                    </p>

                    <p>
                        <button type="submit">Send</button>
                    </p>



                </form>

            </div>
        </main>
        <footer>

            <hr>

            <blockquote>
                <p>“The only way to learn a new programming language is by writing programs in it.”</p>
                <cite>&mdash; <span class="author">Dennis Ritchie</span></cite>
                <p>&copy; 2021 Aaron Buchholz</p>
            </blockquote>

            <picture>
                <source srcset="Images/sc-logo.svg" type="image/svg+xml" width="70">
                <img src=sc-logo.png srcset="Images/sc-logo_105.png 1.5x , Images/sc-logo_140.png 2x"
                    alt="The Sault College logo">
            </picture>


        </footer>
        <a href="#top" title="Back to top">◤</a>
    </div>
</body>

</html>
